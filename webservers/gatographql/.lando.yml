################################################################################
# ⚠️ Troubleshooting: "404 page not found" at https://gatographql.lndo.site/
# (only when `proxy: "ON"` in ~/.lando/config.yml)
#
# Traefik registers only the containers that are UP when it starts, so
# `start-server` and the rebuilds route the app via a file in the proxy's
# hot-reloaded config folder (`route-in-lando-proxy` composer script).
#
# To do it by hand: composer route-in-lando-proxy
# (Avoid `composer restart-lando-proxy`: it drops the requests in flight to
# every other devserver.)
################################################################################

name: gatographql
recipe: wordpress
config:
  webroot: wordpress
  php: '8.1'
  ssl: true
  # @todo Maybe re-enable MariaDB, sometimes giving error when doing `rebuild-server` in Lando
  # database: mariadb
  xdebug: true
  config:
    php: ../shared/config/php.ini
services:
  database:
    portforward: true
  appserver:
    scanner:
      retry: 10
      okCodes:
        - 200
        - 301
        - 302
    overrides:
      environment:
        XDEBUG_MODE: ''
      volumes:
        - ../_shared:/app/_shared-webserver
env_file:
  - defaults.app.env
  - defaults.env
  - defaults.local.env
